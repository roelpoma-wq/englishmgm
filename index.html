<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENGLISH MGM</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--ink:#1d2433;--mut:#6b7488;--ln:#e3e7f0;--pri:#4f6df5;--ok:#1fa971;--bad:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--c:#1c212e;--ink:#eef1f8;--mut:#98a2b8;--ln:#2b3244;--pri:#7f95ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
main{max-width:860px;margin:auto;padding:14px 12px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);margin:4px 0 10px}
.box{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0}
.btn{padding:12px 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{--pc:#8a909c;width:100%;text-align:center;padding:12px 6px;border-radius:16px;background:color-mix(in srgb,var(--pc) 13%,var(--c));border:2px solid color-mix(in srgb,var(--pc) 50%,var(--c))}
.av{font-size:38px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:color-mix(in srgb,var(--pc) 25%,var(--c))}
.p0 .av{filter:grayscale(1)}
.pt{font-size:28px;font-weight:800;color:var(--pc)}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pc)}
.err{color:var(--bad);min-height:20px}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:18px;padding:16px;width:min(92vw,440px);background:var(--c);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid var(--ln);text-align:left}
.pzo{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(10,14,25,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:10}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt{display:block;width:100%;padding:12px 8px;margin-bottom:8px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--ink);font-weight:600;word-break:break-word}.mt.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 22%,var(--c))}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.k{padding:10px 0;border-radius:10px;background:var(--bg);border:1px solid var(--ln);font-weight:700}.k:disabled{opacity:.3}.k.x{background:#e5484d44}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c);font-weight:600}.chip.on{background:var(--pri);color:#fff}

/* ENGLISH MGM · Playful Neon — fase 1: solo presentación.
   No altera autenticación, RPC, puntajes ni datos de Supabase. */
:root{
  --bg:#f5f3ff;--c:#ffffff;--ink:#20213b;--mut:#6f7291;
  --ln:#e7e3fa;--pri:#6748f5;--ok:#13b98c;--bad:#f14c79;
  --neon-pink:#ff4da6;--neon-cyan:#00c8e8;--neon-yellow:#ffc94d;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#14142a;--c:#22223e;--ink:#f6f4ff;--mut:#b6b3d1;--ln:#383653;--pri:#9b7cff;--ok:#36d8a9;--bad:#ff6e91}
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 55% 35% at 0% 0%,rgba(168,111,255,.18),transparent 75%),
    radial-gradient(ellipse 45% 40% at 100% 12%,rgba(0,200,232,.13),transparent 78%),
    var(--bg);
  font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  line-height:1.45;
}
main{max-width:1100px;padding:clamp(14px,3vw,32px) clamp(12px,3vw,24px) 60px}
h1,h2,h3{line-height:1.2;letter-spacing:-.035em}
h1{font-size:clamp(1.8rem,5vw,2.7rem)}
h2{font-size:clamp(1.4rem,3vw,2rem)}
.box{
  border:1px solid var(--ln);
  border-radius:24px;
  box-shadow:0 10px 35px rgba(54,40,126,.075);
  padding:clamp(16px,2.4vw,24px);
}
.btn,.chip,.card,.mt,.k{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
.btn{border-radius:14px;background:linear-gradient(135deg,var(--pri),#a050e9);box-shadow:0 5px 0 rgba(57,39,132,.18);font-weight:800;min-height:44px}
.btn.g{background:var(--c);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,var(--ok),#00aebd)}
.btn.bad{background:linear-gradient(135deg,var(--bad),#f36c57)}
.chip{border-radius:999px;min-height:42px;padding:9px 17px}
.chip.on{background:linear-gradient(120deg,var(--pri),#b65aff);border-color:transparent;box-shadow:0 4px 15px rgba(112,70,245,.25)}
.card{
  border-radius:22px;
  padding:18px 10px;
  box-shadow:0 5px 15px rgba(45,31,92,.055);
  overflow-wrap:anywhere;
}
.av{border-radius:22px;width:76px;height:76px;font-size:42px}
.pt{font-size:clamp(1.8rem,4vw,2.4rem);letter-spacing:-.045em}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,175px),1fr));gap:14px}
input,textarea,select{border-radius:14px;min-height:44px;outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--neon-cyan);outline-offset:3px}
dialog{border:1px solid var(--ln);border-radius:24px;box-shadow:0 22px 90px rgba(16,14,47,.3)}
.bar{height:13px;border-radius:100px}
.bar i{border-radius:100px}
.k{border-radius:12px;min-height:44px}
.mt{border-radius:15px;min-height:52px}
table{font-size:clamp(12px,1.8vw,14px)}
td,th{padding:10px 7px}
@media(hover:hover){
  .btn:hover,.chip:hover,.card:hover,.mt:hover,.k:not(:disabled):hover{transform:translateY(-3px)}
  .btn:hover,.card:hover{box-shadow:0 10px 25px rgba(85,57,177,.18)}
}
@media(max-width:560px){
  main{padding:12px 10px 40px}
  .box{border-radius:20px;margin:9px 0;padding:15px}
  .row{gap:7px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .card{padding:12px 6px;border-radius:17px}
  .av{width:62px;height:62px;font-size:35px}
  .btn{padding:11px 12px}
  .kb{gap:3px}
  .k{padding:8px 0;font-size:13px}
  dialog{width:min(96vw,440px);padding:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* Fase 2: bienvenida y acceso Playful Neon. Lógica de login original intacta. */
.login-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1fr);gap:22px;align-items:stretch;min-height:min(690px,calc(100vh - 100px));margin:clamp(10px,3vw,35px) auto;max-width:1040px}
.login-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:30px;background:linear-gradient(145deg,#5634d8 0%,#8d4deb 55%,#d45fc9 100%);padding:45px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;box-shadow:0 18px 50px rgba(96,64,206,.24)}
.login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.login-hero:before{width:330px;height:330px;background:#ffffff17;top:-155px;left:-90px}
.login-hero:after{width:380px;height:380px;background:#ffffff10;bottom:-230px;right:-130px}
.login-mascot{font-size:clamp(100px,12vw,160px);line-height:1.25;filter:drop-shadow(0 20px 12px #27126b55);animation:mascot-float 4s ease-in-out infinite}
.login-hero-title{font-size:clamp(24px,3.2vw,39px);font-weight:1000;letter-spacing:-.05em;line-height:1.08;max-width:400px;margin:24px auto 0}
.login-hero p{max-width:320px;font-size:17px;opacity:.94}
.login-bubble{position:absolute;background:white;color:#4c32b0;padding:11px 18px;border-radius:18px;font-weight:1000;box-shadow:0 9px 24px #25135d33;transform:rotate(-9deg)}
.bubble-a{top:13%;left:8%}.bubble-b{top:27%;right:8%;transform:rotate(10deg)}
.login-stickers{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:20px}
.login-stickers span{border:1px solid #ffffff55;border-radius:999px;padding:8px 11px;background:#ffffff20;font-size:12px;font-weight:800}
.login-panel{display:flex;flex-direction:column;justify-content:center;margin:0;padding:clamp(22px,4vw,48px);border-radius:30px}
.login-brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:950;letter-spacing:-.05em}
.brand-mark{display:grid;place-items:center;background:#fff2bb;width:44px;height:44px;border-radius:15px}
.login-brand strong{color:var(--pri)}
.login-eyebrow{font-size:12px;font-weight:900;letter-spacing:.15em;color:var(--pri);margin-top:36px}
.login-panel h1{margin:9px 0;font-size:clamp(28px,3.5vw,40px)}
.login-subtitle{color:var(--mut);margin:0 0 25px}
.login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:26px;padding:6px;border-radius:17px;background:var(--bg)}
.login-tab{border-radius:13px;padding:13px 8px;font-weight:850;font-size:15px}
.login-tab.active{background:var(--c);color:var(--pri);box-shadow:0 3px 13px #33217b1c}
.login-panel label{font-weight:800;display:block;margin-bottom:4px}
.login-panel input{background:var(--bg);padding:14px;margin-bottom:18px}
.login-submit{width:100%;font-size:16px;margin-top:8px}
.login-footnote{text-align:center;color:var(--mut);font-size:13px;margin-top:24px}
@keyframes mascot-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@media(max-width:760px){.login-shell{grid-template-columns:1fr;max-width:510px;gap:14px;margin:8px auto}.login-hero{min-height:170px;padding:22px 16px}.login-mascot{font-size:55px}.login-hero-title{font-size:21px;margin-top:4px}.login-hero p,.login-stickers{display:none}.login-bubble{padding:6px 10px;font-size:12px}.bubble-a{top:14%;left:7%}.bubble-b{top:18%;right:7%}.login-panel{padding:24px 20px}.login-eyebrow{margin-top:24px}}
@media(prefers-reduced-motion:reduce){.login-mascot{animation:none}}


/* Fase 2.1: cabecera y métricas de profesor; datos derivados de teacher_data */
.teacher-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;padding:24px 26px;margin:10px 0 15px;border-radius:26px;background:linear-gradient(125deg,#5438d7,#7b51ec 65%,#b85fdc);color:#fff;box-shadow:0 12px 30px #6545d333}
.teacher-eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;opacity:.86}
.teacher-head h1{font-size:clamp(24px,3vw,35px);margin:7px 0}
.teacher-head p{margin:0;opacity:.9}
.teacher-head-actions{display:flex;gap:10px;flex-wrap:wrap}
.teacher-head-actions .btn{background:#fff;color:#5935c8;box-shadow:none}
.teacher-head-actions .btn.g{background:#ffffff24;color:#fff;border-color:#ffffff66}
.teacher-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.teacher-stat{display:flex;flex-direction:column;gap:6px;padding:17px 20px;border-radius:20px;background:var(--c);border:1px solid var(--ln);box-shadow:0 5px 18px #34227a0b}
.teacher-stat span{color:var(--mut);font-weight:750;font-size:13px}
.teacher-stat strong{font-size:clamp(24px,3vw,34px);color:var(--pri);line-height:1}
@media(max-width:560px){.teacher-head{padding:20px 16px}.teacher-head-actions{width:100%}.teacher-head-actions .btn{flex:1}.teacher-stats{gap:7px}.teacher-stat{padding:12px 9px;border-radius:14px}.teacher-stat span{font-size:11px}}


/* Panel de participación: puntos y estrellas independientes */
.award-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.award-face{display:grid;place-items:center;flex:0 0 64px;width:64px;height:64px;font-size:40px;border-radius:20px;background:var(--bg)}
.award-phase{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:900;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--c));border:1px solid color-mix(in srgb,var(--pc) 35%,var(--c))}
.award-totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}
.award-totals>div{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center}
.award-totals strong{font-size:30px;color:var(--pri)}.award-totals span{font-size:13px;font-weight:800}
.award-title{margin:16px 0 8px;font-size:15px}
.award-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.award-controls .btn{font-size:20px;padding:12px 5px;min-height:50px}
.award-stars{grid-template-columns:repeat(2,minmax(0,1fr))}
.award-note{font-size:12px;color:var(--mut);margin:0 0 9px}
.award-actions{margin-top:22px}.award-actions .btn{flex:1}
.award-controls button:disabled{opacity:.4;cursor:not-allowed}

/* Phase cards v1: lightweight, mobile-first, no 3D engine */
.phase-card{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:206px;background:linear-gradient(155deg,color-mix(in srgb,var(--pc) 19%,var(--c)),var(--c) 75%);border:2px solid color-mix(in srgb,var(--pc) 55%,var(--c));box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 24%,transparent),0 9px 19px rgba(36,27,74,.07)}
.phase-card .av{position:relative;flex-shrink:0;background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 40%,white),color-mix(in srgb,var(--pc) 15%,var(--c)));border:2px solid color-mix(in srgb,var(--pc) 60%,white);box-shadow:inset 0 3px 4px rgba(255,255,255,.5),0 5px 0 color-mix(in srgb,var(--pc) 28%,transparent);text-shadow:0 2px 2px rgba(0,0,0,.12)}
.phase-card.p0 .av{filter:grayscale(1)}
.phase-card .phase-badge{font-size:12px;line-height:1.25;font-weight:850;color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--c));border:1px solid color-mix(in srgb,var(--pc) 30%,var(--c));border-radius:999px;padding:5px 8px;max-width:100%;overflow-wrap:anywhere}
.phase-card .student-name{font-size:14px;line-height:1.3;min-height:36px;display:grid;place-items:center}
.phase-card .pt{font-size:27px;line-height:1.15}
.phase-card .phase-stars{font-weight:750;font-size:13px}
.phase-card .phase-progress{width:100%;margin-top:auto;text-align:left}
.phase-card .phase-progress small{display:block;color:var(--mut);font-size:11px;margin-bottom:5px}
.phase-card .bar{height:8px}
.phase-card .phase-progress i{transition:width .3s ease}
.phase-hero{max-width:560px;margin:12px auto;text-align:center;min-height:0;padding:22px}
.phase-hero .av{width:112px;height:112px;font-size:67px;margin-bottom:10px}
.phase-hero .student-name{font-size:clamp(21px,5vw,29px);min-height:0}
.phase-hero .pt{font-size:38px}
.phase-hero .phase-progress{margin:12px 0 3px}
.phase-hero .phase-progress small{font-size:13px}
@media(max-width:560px){.phase-card{padding:12px 7px;min-height:210px}.phase-card .av{width:64px;height:64px;font-size:37px}.phase-hero .av{width:108px;height:108px;font-size:64px}}
@media(prefers-reduced-motion:reduce){.phase-card .phase-progress i{transition:none}}

/* Lightweight phase mascots and event-only reward animations */
.phase-mascot{position:relative;display:inline-grid;place-items:center;width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--pc) 22%,white),color-mix(in srgb,var(--pc) 50%,#fff));border:2px solid color-mix(in srgb,var(--pc) 62%,white);box-shadow:inset 0 3px 2px rgba(255,255,255,.65),0 5px 0 color-mix(in srgb,var(--pc) 35%,transparent),0 8px 13px rgba(20,16,48,.12);font-size:32px;line-height:1}
.phase-mascot.p0{filter:grayscale(1)}
.phase-mascot .mascot-mark{position:absolute;right:-8px;bottom:-7px;font-size:17px;background:var(--c);border-radius:50%;padding:3px;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.phase-card .phase-mascot{margin:0 auto 4px}
.phase-hero .phase-mascot{width:84px;height:84px;font-size:48px;margin-bottom:10px}
.phase-hero .phase-mascot .mascot-mark{font-size:23px}
.reward-toast{position:fixed;z-index:9999;top:18px;left:50%;transform:translateX(-50%);max-width:min(92vw,360px);padding:14px 20px;border-radius:19px;background:#262044;color:white;box-shadow:0 12px 32px rgba(20,14,50,.28);font-weight:850;text-align:center;pointer-events:none;animation:rewardIn .32s ease-out both}
.reward-toast.level-up{background:linear-gradient(120deg,#6541df,#b13bce)}
@keyframes rewardIn{from{opacity:0;transform:translate(-50%,-12px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@media(prefers-reduced-motion:reduce){.reward-toast{animation:none}}

/* Avatar Studio — lightweight, mobile-first */
.avatar-zone{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px 0}
.avatar-art{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:116px;height:142px;border-radius:28px;background:linear-gradient(155deg,#e8faff,#f5e8ff);box-shadow:inset 0 -7px 0 #0000000b,0 9px 20px #27245b20;overflow:hidden;isolation:isolate;flex-shrink:0}
.avatar-art.big{width:180px;height:210px}
.avatar-art .av-hair{position:absolute;top:16%;width:60%;height:40%;background:var(--hair,#372337);border-radius:48% 48% 32% 32%;transform:rotate(-3deg);box-shadow:inset -9px 4px 0 #ffffff20}
.avatar-art .av-hair.long{height:57%;border-radius:44% 44% 24% 24%}
.avatar-art .av-hair.curly{border-radius:40%;box-shadow:-8px 0 0 var(--hair),8px 0 0 var(--hair),inset -6px 4px 0 #ffffff26}
.avatar-art .av-hair.spiky{clip-path:polygon(0 36%,10% 5%,29% 27%,43% 0,58% 26%,76% 4%,88% 29%,100% 10%,100% 100%,0 100%)}
.avatar-art .av-face{position:absolute;top:27%;width:48%;height:40%;background:var(--skin,#edb58f);border-radius:43% 43% 46% 46%;box-shadow:inset -6px -4px 0 #00000012;z-index:2}
.avatar-art .av-eyes{position:absolute;top:43%;width:28%;display:flex;justify-content:space-between;z-index:3}
.avatar-art .av-eyes:before,.avatar-art .av-eyes:after{content:"";width:7px;height:9px;background:#30243f;border-radius:50%}
.avatar-art .av-smile{position:absolute;top:55%;width:13%;height:7%;border-bottom:3px solid #8b4353;border-radius:50%;z-index:3}
.avatar-art .av-body{position:absolute;bottom:-14%;width:78%;height:42%;background:var(--shirt,#7461ef);border-radius:45% 45% 0 0;box-shadow:inset -12px 0 0 #00000016;z-index:1}
.avatar-art .av-acc{position:absolute;top:35%;font-size:28px;z-index:5;line-height:1}
.avatar-art .av-acc.cap,.avatar-art .av-acc.crown{top:7%;font-size:40px}
.avatar-art.big .av-acc{font-size:40px}.avatar-art.big .av-acc.cap,.avatar-art.big .av-acc.crown{font-size:54px}
.avatar-studio{max-width:580px}.avatar-studio h3{margin:0 0 5px}
.avatar-studio .av-hint{font-size:13px;opacity:.8}
.avatar-group{margin:12px 0}.avatar-group strong{display:block;margin-bottom:7px}
.avatar-options{display:flex;gap:7px;flex-wrap:wrap}
.avatar-choice{border:2px solid #d9d8f5;border-radius:14px;background:#fff;color:#282447;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer}
.avatar-choice.active{border-color:#7758ff;background:#eeeaff}
.avatar-choice:disabled{opacity:.46;cursor:not-allowed}
.avatar-studio .avatar-zone{margin:8px auto 14px}

async function rpc(fn,a){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(j&&j.message||"error");return j;
}

async function doLogin(){
  $("e").textContent="";
  try{
    const r=await rpc("app_login",{p_role:role,p_user:$("u").value,p_secret:$("s").value});
    if(r.error){$("e").textContent=r.error==="locked"?"Demasiados intentos. Espera 15 minutos.":"Usuario o clave incorrectos.";return}
    tok=r.token;sessionStorage.setItem("t",tok);sessionStorage.setItem("r",role);go();
  }catch(e){$("e").textContent="Sin conexión con el servidor."}
}
function go(){role==="teacher"?tea():(stu(),timer=setInterval(stu,8000))}
function out(){
  lastStudentSnapshot=null;
  clearInterval(timer);if(tok)rpc("app_logout",{t:tok}).catch(()=>{});
  sessionStorage.clear();tok=null;login();
}

function avatarOpen(){
 if(!avatarStudent)return;
 avatarDraft=avatarClean(avatarStudent.avatar_config);avatarEditing=true;
 avatarDraw();if(!$("d").open)$("d").showModal();
}
function avatarClose(){if(avatarBusy)return;avatarEditing=false;shut()}
function avatarPick(k,v){
 if(!avatarDraft||avatarBusy||!AV_OPTIONS[k]||!AV_OPTIONS[k].some(x=>x[0]===v))return;
 if(Number(avatarStudent.unlock_level||0)<AV_LEVEL[k]&&v!==AV_DEFAULT[k])return;
 avatarDraft[k]=v;avatarDraw();
}
function avatarDraw(){
 const level=Number(avatarStudent.unlock_level)||0;
 const h='<div class="avatar-studio"><h3>✨ Mi avatar</h3><p class="av-hint">Personaliza tu personaje. Los desbloqueos son permanentes.</p><div class="avatar-zone">'+avatarArt(avatarDraft,true,avatarStudent.gender)+'</div>'+
 Object.keys(AV_OPTIONS).map(k=>'<div class="avatar-group"><strong>'+AV_LABEL[k]+' '+(level<AV_LEVEL[k]?'🔒':'🔓')+'</strong><div class="avatar-options">'+AV_OPTIONS[k].map(([v,label])=>'<button type="button" class="avatar-choice '+(avatarDraft[k]===v?'active':'')+'" '+(avatarBusy||level<AV_LEVEL[k]&&v!==AV_DEFAULT[k]?'disabled':'')+' onclick="avatarPick(\''+k+'\',\''+v+'\')">'+label+'</button>').join('')+'</div></div>').join('')+
 '<div class="row"><button class="btn g" onclick="avatarClose()" '+(avatarBusy?'disabled':'')+'>Cancelar</button><button class="btn ok" onclick="avatarSave()" '+(avatarBusy?'disabled':'')+'>'+(avatarBusy?'Guardando…':'💾 Guardar avatar')+'</button></div></div>';
 $("d").innerHTML=h;
}
async function avatarSave(){
 if(avatarBusy||!avatarDraft)return;avatarBusy=true;avatarDraw();
 try{
  const result=await rpc("student_save_avatar",{t:tok,p_avatar:avatarDraft});
  if(!result||!result.ok)throw new Error("No se pudo guardar");
  avatarStudent.avatar_config=avatarClean(result.avatar);avatarEditing=false;shut();rewardToast("✨ ¡Avatar guardado!");stu();
 }catch(e){alert("No se pudo guardar el avatar: "+e.message)}
 finally{avatarBusy=false;if(avatarEditing)avatarDraw()}
}

async function stu(){
  if(playing||avatarEditing)return;
  try{
    const m=await rpc("student_me",{t:tok});if(!m)return out();
    let A=[];try{A=await rpc("student_activities",{t:tok})}catch(e){}
    if(playing||avatarEditing)return;
    avatarStudent=m;
    const p=ph(m.points),P=PH[p];
    const snap={points:Number(m.points)||0,stars:Number(m.stars)||0,phase:p};
    const prior=lastStudentSnapshot;lastStudentSnapshot=snap;
    $("app").innerHTML=`<div class="box card phase-card phase-hero p${p}" style="--pc:${P.c}">${phaseMascot(m.points)}
    <h2 class="student-name">${esc(m.name)}</h2><span class="phase-badge">${phaseIcon[p]} ${esc(P.n)}</span><div class="pt">${m.points} <small style="font-size:16px">pts</small></div><div class="phase-stars">⭐ ${m.stars||0} · ${esc(m.room)}</div>${phaseProgress(m.points)}<div class="avatar-zone">${avatarArt(m.avatar_config,false,m.gender)}<button class="btn ok" onclick="avatarOpen()">✨ Personalizar avatar</button></div></div>
    ${A.length?actsHtml(A):'<div class="box">🎮 Aún no hay actividades.</div>'}<button class="btn g" onclick="out()">Salir</button>`;
    if(prior){if(snap.phase>prior.phase)rewardToast('🎉 ¡Nueva fase! '+PH[snap.phase].n,true);else if(snap.points>prior.points)rewardToast('🎯 +'+(snap.points-prior.points)+' puntos');else if(snap.stars>prior.stars)rewardToast('⭐ +'+(snap.stars-prior.stars)+' estrella(s)');}
  }catch(e){}
}

async function tea(){
  try{D=await rpc("teacher_data",{t:tok})}catch(e){return out()}
  if(!D.some(r=>r.id===cur))cur=D[0]?D[0].id:null;drawT();
}

  const r=D.find(x=>x.id===cur);
  let h=`<header class="teacher-head"><div><span class="teacher-eyebrow">ENGLISH MGM · TEACHER SPACE</span><h1>👩‍🏫 Mi aula interactiva</h1><p>Gestiona tus salones, celebra los logros y crea actividades.</p></div><div class="teacher-head-actions"><button class="btn" onclick="actsT()">🎯 Actividades</button><button class="btn g" onclick="out()">Salir</button></div></header><section class="teacher-stats"><div class="teacher-stat"><span>🏫 Salones</span><strong>${D.length}</strong></div><div class="teacher-stat"><span>🎒 Estudiantes</span><strong>${D.reduce((n,x)=>n+(x.students||[]).length,0)}</strong></div><div class="teacher-stat"><span>⭐ Estrellas</span><strong>${D.reduce((n,x)=>n+(x.students||[]).reduce((v,y)=>v+(Number(y.stars)||0),0),0)}</strong></div></section><div class="row" style="margin:10px 0;overflow-x:auto">`+D.map(x=>`<button class="chip ${x.id===cur?"on":""}" onclick="cur='${x.id}';drawT()">${esc(x.name)}</button>`).join("")+`<button class="chip" onclick="addRoom()">+ Salón</button></div>`;

function hang(s){
  const n=Math.round((s.lives_max-s.lives)*6/s.lives_max),c=n>=6?"#e5484d":"currentColor";
  return `<svg viewBox="0 0 120 120" width="150" height="150" style="display:block;margin:6px auto;color:var(--ink)" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 112H75M30 112V10H80V24"/>
  <g stroke="${c}">${n>0?'<circle cx="80" cy="34" r="10"/>':""}${n>1?'<path d="M80 44V76"/>':""}${n>2?'<path d="M80 52L65 66"/>':""}${n>3?'<path d="M80 52L95 66"/>':""}${n>4?'<path d="M80 76L68 98"/>':""}${n>5?'<path d="M80 76L92 98"/>':""}</g></svg>`;
}

const KI={translate:"🌐",hangman:"🔤",matching:"🔗"};
let SL=null;
function mtc(s,m){
  const mp={},rj={};(s.used||"").split(",").filter(Boolean).forEach(x=>{const [i,j]=x.split(":");mp[i]=j;rj[j]=i});
  const col=(arr,side)=>(arr||[]).map((t,k)=>{const pi=side==="l"?(mp[k]!==undefined?k:null):(rj[k]!==undefined?+rj[k]:null);
    return `<button class="mt ${side==="l"&&SL===k?"on":""}" ${pi!==null?"disabled":""} style="${pi!==null?`background:hsl(${pi*47%360} 60% 80%);color:#222;border-color:transparent`:""}" onclick="pick('${side}',${k})">${esc(t)}</button>`}).join("");
  return `<p>Une las parejas · ${s.idx}/${s.total}</p><div class="err" style="text-align:center">${m}</div><div class="mg"><div>${col(s.lefts,"l")}</div><div>${col(s.rights,"r")}</div></div>`;
}
async function pick(side,k){
  if(side==="l"){SL=SL===k?null:k;drawG();return}
  if(SL===null){msg="Primero elige un elemento de la izquierda";drawG();return}
  const i=SL;SL=null;
  try{const r=await rpc("game_pair",{t:tok,p_gid:G.id,p_i:i,p_j:k});G=r.state;msg=r.ok?"":"❌ No son pareja";drawG()}catch(e){msg="Error de conexión";drawG()}
}

tok&&role?go():login();
</script></body></html>
